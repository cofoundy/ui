schema_version: 1.0
cycle: chat-sim-rewrite
created: 2026-09-04
domain: software (frontend-only)
session_mode: delivery
repo: packages/ui
branch: cto/chat-sim-rewrite
worker: cto-d606f0

goal: >
  Reescritura desde cero de un simulador de chat multi-canal en @cofoundy/ui, con arquitectura de
  channel-adapter, capa de captura determinista para marketing, y un skin reusable por la app de
  Fovente (inbox-ai). Destino final: open source.

# --- Las 6 forcing questions ---

problema_real: >
  Existen TRES implementaciones del mismo chat en Cofoundy (ChatDemo.astro 190 líneas en la landing
  de Fovente, MessageBubble.tsx 68 KB en inbox-ai prod, y las primitivas de @cofoundy/ui que ninguno
  usa de verdad). Las dos primeras comparten código copiado, no abstracción: mismo SVG de tick, misma
  regla de agrupación, citada textualmente entre repos. Ya hay un lenguaje de diseño validado en
  producción; lo que no hay es un lugar donde viva.

quien_lo_sufre:
  - "Fovente (inbox-ai): mantiene 68 KB de bubble + 13 KB de composer móvil forkeados"
  - "Marketing: no hay forma de generar imágenes de conversación reproducibles; el prior art del rubro las graba con herramientas externas"
  - "Las dos landings (Astro): no pueden consumir @cofoundy/ui porque es React-only"

por_que_ahora: >
  Telegram ya vende (canal vivo en inbox-ai junto a WhatsApp vía Meta y Kapso). El modelo de
  capabilities por canal ya está resuelto en prod en Python. La abstracción se puede espejar en vez
  de inventarse, y el segundo canal es real, no hipotético.

mvp_scope:
  incluye:
    - "core/: timeline compilada determinista (guion+seed -> [(t,evento)]), playhead único, seek O(log n)"
    - "adapters/: WhatsApp + Telegram, espejando el modelo de capabilities de inbox-ai"
    - "react/: renderer para app (Fovente/inbox-ai)"
    - "element/: custom element para las landings Astro — pre-render + reveal por clase"
    - "capture/: CLI headless -> PNG/WebP deterministas + secuencia a video"
    - "Token y tipo de canal para iMessage (hoy faltan; el resto de los 7 ya existen)"
    - "MobileBaseline para todo lo nuevo + resolución real del teclado (visualViewport/dvh)"
  excluye:
    - "iMessage como adapter completo — se diseña la interfaz contra 3 canales, se implementan 2"
    - "Reemplazar el ConversationView de inbox-ai (el ciclo entrega el skin, no migra su app)"
    - "Release público (queda tras gate humano D-1)"

definicion_de_exito:
  - "estado(t) es funcion pura: dos corridas del mismo guion+seed dan PNG byte-identicos"
  - "El mismo guion renderiza en WhatsApp y en Telegram con diferencias estructurales reales (no solo color)"
  - "Las dos landings Astro pueden montarlo sin agregar React"
  - "Medible: N KB del fork de inbox-ai quedan reemplazables sin regresion visual"
  - "El teclado movil se resuelve de forma que el fork de MobileComposer pierda su razon de ser"

restricciones:
  - "NO romper la continuidad visual entre el hero de fovente.cofoundy.ai y el inbox de app.fovente — es deliberada"
  - "inbox-ai consume github:cofoundy/ui#main SIN PIN: todo push a main entra a su prod sin gate"
  - "packages/* es Tier B; no existe rama dev; main no protegida pero auto-deploya Storybook"
  - "No embeber assets de terceros (el prior art hardcodea fotos de Unsplash y llama a api.microlink.io en runtime)"

decisiones_humanas_abiertas:
  D-1:
    pregunta: "¿Va linea de prior art / atribucion en el README al abrir el repo?"
    recomendacion_cto: "si — costo cero, norma OSS, y el downside reputacional de omitirla es desproporcionado"
    gate: "antes del push publico, NO antes de construir"
  D-2:
    pregunta: "¿Hay deadline de la app de Fovente que justifique invertir la secuencia?"
    default_asumido: "no — se construye simulador primero, skin de app despues"

agents:
  roles: []   # se componen en Fase 4 desde las columnas de la matriz
