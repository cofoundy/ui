name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Chromatic NO es compuerta de deploy (decisión de André, 2026-09-30: «quita eso q sea
          # filtro para deployment, q sea automático e inmediato»). Los cambios visuales se
          # aceptan solos como baseline y el check nunca queda en rojo por diferencias; sigue
          # sirviendo como historial visual por build. Un error real de Storybook sí falla.
          autoAcceptChanges: true
          exitZeroOnChanges: true
